version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ttad_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: ttad_frontend
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173

  db:
    image: postgres:15
    container_name: ttad_db
    restart: always
    environment:
      POSTGRES_USER: ttad
      POSTGRES_PASSWORD: ttad123
      POSTGRES_DB: ttad_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: